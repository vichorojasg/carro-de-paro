<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist Carro de Paro 🚑</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div class="max-w-2xl mx-auto p-6 space-y-6">
    <h1 class="text-2xl font-semibold text-center text-gray-900 mb-4">Checklist Carro de Paro 🚑</h1>

    <!-- Identificación -->
    <div class="bg-white p-5 rounded-3xl shadow-md space-y-4">
      <div>
        <label class="block text-sm text-gray-500">Servicio / Unidad</label>
        <div class="flex space-x-2 mt-1">
          <select id="servicio" class="flex-1 p-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-1 focus:ring-gray-300"></select>
          <button id="agregarServicioBtn" class="bg-gray-900 text-white px-4 rounded-2xl hover:bg-gray-800 transition">Agregar</button>
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-500">Responsable</label>
        <input id="responsable" type="text" placeholder="Nombre del responsable" class="w-full p-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-1 focus:ring-gray-300" />
      </div>

      <div>
        <label class="block text-sm text-gray-500">Fecha</label>
        <input id="fecha-auto" type="text" class="w-full p-3 rounded-2xl bg-gray-100 text-gray-400 border border-gray-200" readonly />
      </div>
    </div>

    <!-- Categorías -->
    <div id="categorias" class="space-y-4"></div>

    <!-- Observaciones -->
    <div class="bg-white p-5 rounded-3xl shadow-md">
      <label class="block text-sm text-gray-500 mb-2">Observaciones</label>
      <textarea id="observaciones" placeholder="Escriba aquí..." class="w-full p-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-1 focus:ring-gray-300"></textarea>
    </div>

    <!-- Botón Guardar -->
    <button id="guardarBtn" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-medium py-3 rounded-3xl transition">Guardar Chequeo</button>

    <!-- Resultados -->
    <div id="resultado" class="mt-6 space-y-3"></div>

    <!-- Historial -->
    <div id="historial" class="mt-6 space-y-4"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhOvzUAUxr8SwdexIwurg_18J0yyab-4oXy2gMkVJ-du1EjUclmH8zDvC9A5ZJDAEj/exec";

    let categorias = {};
    let servicios = [];
    let historialPorServicio = {};

    const contenedor = document.getElementById("categorias");
    const selectServicio = document.getElementById("servicio");

    // Fecha automática
    document.getElementById("fecha-auto").value = new Date().toLocaleString();
    // Cargar solo servicios primero
    async function cargarServicios() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        servicios = data.servicios || [];
        renderServicios();
        cargarCategoriasYHistorial(data); // cargar lo demás en segundo plano
      } catch (error) {
        console.error("Error cargando servicios:", error);
      }
    }

    function renderServicios() {
      selectServicio.innerHTML = '<option value="">Seleccione un servicio</option>';
      servicios.forEach(s => {
        const option = document.createElement("option");
        option.value = s;
        option.textContent = s;
        selectServicio.appendChild(option);
      });
    }

    function cargarCategoriasYHistorial(data) {
      // Categorías
      categorias = {};
      data.items.forEach(item => {
        if (!categorias[item.categoria]) categorias[item.categoria] = [];
        categorias[item.categoria].push({ nombre: item.nombre, recomendado: parseInt(item.recomendado) });
      });
      renderCategorias();

      // Historial
      historialPorServicio = {};
      data.historial.forEach(h => {
        if (!historialPorServicio[h.servicio]) historialPorServicio[h.servicio] = [];
        historialPorServicio[h.servicio].push({
          fecha: h.fecha,
          servicio: h.servicio,
          responsable: h.responsable,
          porcentaje: parseInt(h.porcentaje),
          faltantes: h.faltantes.split(", ").filter(f => f),
          observaciones: h.observaciones
        });
      });
    }

    function renderCategorias() {
      contenedor.innerHTML = "";
      for (let cat in categorias) {
        const div = document.createElement("div");
        div.className = "bg-white p-5 rounded-3xl shadow-md mb-4";
        div.innerHTML = `<h2 class='text-base font-medium mb-4 text-gray-800'>${cat}</h2>`;
        categorias[cat].forEach((item, index) => {
          div.innerHTML += `
            <div class='flex items-center mb-3'>
              <span class='w-2/3 text-gray-700'>${item.nombre}</span>
              <input type='number' min='0' id='${cat}-${index}' class='w-1/3 p-2 border border-gray-200 rounded-2xl focus:outline-none focus:ring-1 focus:ring-gray-300' placeholder='Cantidad' />
            </div>
          `;
        });
        contenedor.appendChild(div);
      }
    }

    // Agregar nuevo servicio
    document.getElementById("agregarServicioBtn").addEventListener("click", async () => {
      const nuevo = prompt("Ingrese el nombre del nuevo servicio:");
      if (nuevo && !servicios.includes(nuevo)) {
        try {
          const resp = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ servicio: nuevo, fecha: new Date().toLocaleString(), responsable: "", porcentaje: 0, faltantes: [], observaciones: "" })
          });
          const result = await resp.json();
          if (result.status === "ok") {
            servicios.push(nuevo);
            renderServicios();
          }
        } catch (err) {
          console.error("Error agregando servicio:", err);
        }
      }
    });

    // Guardar chequeo
    document.getElementById("guardarBtn").addEventListener("click", async () => {
      const servicio = selectServicio.value;
      if (!servicio) return alert("Seleccione un servicio");

      const responsable = document.getElementById("responsable").value;
      const fechaAuto = document.getElementById("fecha-auto").value;
      const observaciones = document.getElementById("observaciones").value;

      let faltantes = [], total = 0, completos = 0;
      for (let cat in categorias) {
        categorias[cat].forEach((item, index) => {
          const valor = parseInt(document.getElementById(`${cat}-${index}`).value) || 0;
          total++;
          if (valor >= item.recomendado) completos++;
          else faltantes.push(item.nombre);
        });
      }

      const porcentaje = Math.round((completos / total) * 100);

      // Guardar en Google Sheet
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ servicio, responsable, fecha: fechaAuto, porcentaje, faltantes, observaciones })
        });
      } catch (err) {
        console.error("Error guardando historial:", err);
      }

      renderResultado(servicio, responsable, fechaAuto, observaciones, porcentaje, faltantes);
      renderHistorial(servicio);
    });

    function renderResultado(servicio, responsable, fechaAuto, observaciones, porcentaje, faltantes) {
      const color = porcentaje === 100 ? "bg-green-400" : porcentaje >= 70 ? "bg-yellow-300" : "bg-red-400";
      document.getElementById("resultado").innerHTML = `
        <div class='bg-white p-5 rounded-3xl shadow-md space-y-3'>
          <h3 class='font-medium text-lg text-gray-800 mb-2'>Resultado del Chequeo</h3>
          <p><strong>Servicio:</strong> ${servicio}</p>
          <p><strong>Responsable:</strong> ${responsable}</p>
          <p><strong>Fecha:</strong> ${fechaAuto}</p>
          <p><strong>Observaciones:</strong> ${observaciones || "Ninguna"}</p>
          <div class='p-4 rounded-2xl text-white font-semibold text-center ${color}'>${porcentaje}% completado</div>
          <div>
            <h4 class='font-medium mt-4 text-gray-800'>Ítems Críticos</h4>
            <ul class='list-disc ml-6 text-gray-700'>${faltantes.length ? faltantes.map(f => `<li>${f}</li>`).join("") : "<li>Ninguno</li>"}</ul>
          </div>
        </div>
      `;
    }

    function renderHistorial(servicio) {
      const histDiv = document.getElementById("historial");
      histDiv.innerHTML = "<h3 class='text-lg font-medium text-gray-800 mb-4'>Historial de Chequeos</h3>";
      if (historialPorServicio[servicio]) {
        historialPorServicio[servicio].forEach(h => {
          const color = h.porcentaje === 100 ? "bg-green-400" : h.porcentaje >= 70 ? "bg-yellow-300" : "bg-red-400";
          histDiv.innerHTML += `
            <div class='bg-white p-4 rounded-3xl shadow-md flex justify-between items-center'>
              <div>
                <p class='text-sm text-gray-500'>${h.fecha}</p>
                <p class='text-gray-700'>${h.servicio} - ${h.responsable}</p>
                <p class='text-gray-700 text-sm'>Observaciones: ${h.observaciones || "Ninguna"}</p>
              </div>
              <div class='px-4 py-2 rounded-2xl text-white font-medium ${color}'>${h.porcentaje}%</div>
            </div>
          `;
        });
      } else {
        histDiv.innerHTML += "<p class='text-gray-500'>No hay chequeos para este servicio aún.</p>";
      }
    }

    selectServicio.addEventListener("change", e => {
      const servicio = e.target.value;
      if (servicio) renderHistorial(servicio);
      else document.getElementById("historial").innerHTML = "";
    });

    // Inicializar
    cargarServicios();
  </script>
</body>
</html>
